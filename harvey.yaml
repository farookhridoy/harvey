  pricing: "Basic 999 BDT/month, Standard 2,499 BDT/month, Premium 4,999 BDT/month"
  key_benefits:
    - "Replaces the paper appointment book and patient files, so nothing gets lost"
    - "Appointments, dental charts, payments and PDF invoices in one screen"
    - "Manage more than one chamber and see money for each"
    - "Works on a phone, pay by bKash, free demo and setup together with you"
  objection_responses:
    "too expensive": "Understood. Basic is 999 BDT/month, and one recovered missed appointment usually covers it. The trial is free."
    "already have a solution": "That makes sense. What is the one thing you wish it did better?"
    "not interested": "No problem at all. The demo link stays open if you ever want to look."
    "too busy to learn": "We set it up with you and can import your existing patient list, so you start with your data already in."
  offer:
    primary: "Monthly subscription from 999 BDT/month"
    entry: "Free demo plus free trial for your clinic, set up together with you"
    goal: "start_trial"
    booking_method: "ask_preference"
    booking_url: "https://dentora.thelarasoft.com/"
    meeting_duration: "10 minutes"
    meeting_owner: "Founder"

